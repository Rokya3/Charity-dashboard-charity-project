<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
     integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA=="
      crossorigin="anonymous" referrerpolicy="no-referrer" />
      <!--<script src="https:cdn.jsdelivr.net/npm/chart.js"></script>-->


      <!--<link rel="stylesheet" href="assets/css/bootstrap.min.css">-->
      <link rel="stylesheet" href="charity.css">
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>CHARITY</title>

</head>
<body>
<div class="my-dashboard">
  
<!-- Navbar -->
<nav class="navbar navbar-expand-lg shadow-sm">
  <div class="container">
 <a class="navbar-brand fw-bold " href="#"><img src ="images/logo.jpeg" alt="عطاء" height="55px" class="rounded-circle"></a>
    
   <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
   data-bs-target="#mainNav">
   <span class="navbar-toggler-icon"></span>
  </button>
 

    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav mx-auto">
        
        <li class="nav-item active"><a class="nav-link" href="#">الرئيسية</a></li>
        <li class="nav-item active"><a class="nav-link" href="#">الجمعيات</a></li>
        <li class="nav-item active"><a class="nav-link" href="#">عن المنصة</a></li>
        <li class="nav-item active"><a class="nav-link" href="#">تواصل معنا</a></li>
      </ul>
      

      <div>
        <button class="btn btn-warning btn-sm px-4 p-2 mt-1 mx-2 control-btn" onclick="window.location.href='register.html'" >حساب جديد</button>
        <button class="btn btn-outline-warning px-3 p-1.5 mt-1" onclick="window.location.href='login.html'">دخول</button>
      </div>
    </div>
  </div>
</nav>

<!-- Header -->
<div class="container mt-4">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold">لوحة تحكم الجمعية</h4>
   <button onclick="window.open('https://share.google/ddl3Iy8m3NnxvG55Z')" class="alert alert-warning btn-sm text-warning p-2 fw-bold" style="cursor: pointer;">
        جمعية الإحسان الخيرية
    </button>
  </div>

  <!-- Stats -->
  <div class="row g-4 mb-4">

   <div class="col-md-4">
      <div class="stat-card blue">
        <p>تبرعات واردة</p>
        <h4 id="total-donations">0</h4>
      </div>
    </div>

    <div class="col-md-4">
      <div class="stat-card green">
        <p>طلبات مستفيدين</p>
        <h4 id="beneficiary-requests">0</h4>
      </div>
    </div>

    <div class="col-md-4">
     <div class="stat-card purple">
        <p>متطوعون نشطون</p>
        <h4 id="active-volunteers">0</h4>
      </div>
    </div>

  </div>

  <!-- Tables -->
  <div class="row g-4">

    
    <!-- Donations -->
    <div class="col-md-6">
      <div class="card shadow-sm p-3">
        <div class="d-flex justify-content-between mb-3">
          <h5 class="fw-bold">التبرعات الجديدة</h5>
          <a href="#" id="show-all-donations" class="small text-warning fw-bold">عرض الكل</a>
        </div>


        <ul class="list-group list-group-flush" id="donations-list">

          

        </ul>
      </div>
    </div>

     <!-- Requests -->
    <div class="col-md-6">
      <div class="card shadow-sm p-3">
        <div class="d-flex justify-content-between mb-2">
          <h5 class="fw-bold">طلبات المستفيدين</h5>
          <a href="#" id="show-all-requests" class="small text-warning fw-bold">عرض الكل</a>
        </div>

        <ul class="list-group list-group-flush" id="beneficiary-list">

         
           
        </ul>
      </div>
    </div>


  </div>
</div>


















<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!--<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>-->
<script src="charity.js"></script>

</body>
</html>
